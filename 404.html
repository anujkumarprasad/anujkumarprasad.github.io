<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3;url=/" />
    <title>404 - Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .font-display {
            font-family: 'Space Grotesk', 'Inter', system_ui, sans-serif;
            font-weight: 600;
        }

        .error-code {
            font-size: 120px;
            line-height: 1;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981 0%, #4ade80 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 0.9;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <div class="min-h-screen flex items-center justify-center px-6">
        <div class="max-w-md w-full text-center">
            <!-- 404 Number -->
            <div class="mb-8">
                <div class="error-code font-display">404</div>
            </div>

            <!-- Message -->
            <h1 class="text-3xl font-semibold tracking-tight mb-3">Page not found</h1>
            <p class="text-zinc-400 text-lg mb-8">
                Sorry, the page you're looking for doesn't exist or has been moved.
            </p>

            <!-- Redirect notice -->
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 mb-8">
                <div class="flex items-center justify-center gap-x-3 text-sm">
                    <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                    <span class="text-zinc-400">Redirecting to homepage in</span>
                    <span id="countdown" class="font-mono font-semibold text-white">3</span>
                    <span class="text-zinc-400">seconds...</span>
                </div>
            </div>

            <!-- Manual redirect button -->
            <a href="/" 
               class="inline-flex items-center justify-center gap-x-2 bg-white text-zinc-950 hover:bg-zinc-200 transition-colors font-semibold px-6 py-3 rounded-2xl text-sm">
                <span>Go to homepage now</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </a>

            <p class="mt-8 text-xs text-zinc-500">
                If you believe this is an error, please contact support.
            </p>
        </div>
    </div>

    <script>
        // Countdown timer
        let seconds = 3;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(timer);
            }
        }, 1000);

        // Optional: Add keyboard support to go home immediately
        document.addEventListener('keydown', function(e) {
            if (e.key === '/' || e.key === 'Enter') {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
