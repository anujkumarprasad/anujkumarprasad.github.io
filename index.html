<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Refresh at 31 Dec 2026 11:11 PM IST</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 700px;
            width: 100%;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 30px;
            font-weight: 600;
        }
        
        .target-time {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 40px 0;
            padding: 30px;
            border: 3px solid #ffffff;
            border-radius: 12px;
            display: inline-block;
            background-color: #1a1a1a;
        }
        
        .countdown {
            font-size: 2.8rem;
            font-weight: 600;
            margin: 30px 0;
            color: #ffffff;
        }
        
        .message {
            font-size: 1.3rem;
            margin-top: 20px;
            color: #cccccc;
        }
        
        .note {
            font-size: 0.95rem;
            margin-top: 40px;
            color: #aaaaaa;
            font-style: italic;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }
            .target-time {
                font-size: 2.4rem;
                padding: 20px;
            }
            .countdown {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>This page will automatically refresh when the time arrives</h1>
        
        <div class="target-time" id="target-time">
            31 December 2026<br>
            11:11 PM IST
        </div>
        
        <div class="countdown" id="countdown">
            Calculating time remaining...
        </div>
        
        <p class="message">
            The page will refresh automatically at exactly 31 Dec 2026, 11:11 PM IST.
        </p>
        
        <p class="note">
            Time is calculated in IST (Indian Standard Time). 
            Countdown updates every second.
        </p>
    </div>

    <script>
        // === Target time: 31 December 2026, 11:11 PM IST ===
        // We convert IST to UTC because JavaScript Date.UTC works in UTC.
        // 11:11 PM IST = 17:41 UTC (IST is 5 hours 30 minutes ahead of UTC)
        const targetTimestamp = Date.UTC(2026, 11, 31, 17, 41, 0);

        function updateCountdown() {
            const now = Date.now();
            const remaining = targetTimestamp - now;   // how much time is left in milliseconds

            const countdownElement = document.getElementById('countdown');

            if (remaining <= 0) {
                // Time's up! Show message and refresh the page
                countdownElement.innerHTML = "Time has arrived! Refreshing the page...";
                clearInterval(intervalId);

                // Give the user half a second to see the message before refreshing
                setTimeout(() => {
                    window.location.reload();
                }, 500);

                return;
            }

            // Break down the remaining time into days, hours, minutes, seconds
            const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
            const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

            // Update the big countdown text on screen
            countdownElement.innerHTML = 
                `${days} days &nbsp;&nbsp; ${hours} hours &nbsp;&nbsp; ${minutes} minutes &nbsp;&nbsp; ${seconds} seconds`;
        }

        // Run once right away so user sees the countdown immediately
        updateCountdown();

        // Keep updating the countdown every second
        const intervalId = setInterval(updateCountdown, 1000);

        // Safety backup: check every 5 seconds in case the 1-second timer somehow misses
        // (rare, but just in case)
        setInterval(() => {
            if (Date.now() >= targetTimestamp) {
                window.location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
